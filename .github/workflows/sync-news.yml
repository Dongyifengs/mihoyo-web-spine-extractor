name: 同步原神网页活动
on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新获取并覆盖（含无变化、未收录条目）'
        required: false
        type: boolean
        default: false
  schedule:
    # UTC -> 北京时间 12:30、14:30、13:00、18:00、次日 00:00
    - cron: '30 4,6 * * *'
    - cron: '0 5,10,16 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: news-import-and-deploy
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: _source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _source/scripts/importer/requirements.txt
      - run: pip install -r scripts/importer/requirements.txt
      - name: 获取新闻并解析变化
        id: sync
        env:
          FORCE_SYNC: ${{ inputs.force }}
        run: |
          if [ "$FORCE_SYNC" = "true" ]; then
            python scripts/sync-news.py --force
          else
            python scripts/sync-news.py
          fi
      - name: 保存扫描报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-sync-report
          path: |
            _source/public/sync-status.json
            _source/sync-failures.json
            _source/sync-state.json
      - uses: actions/setup-node@v4
        if: steps.sync.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _source/package-lock.json
      - if: steps.sync.outputs.changed == 'true'
        run: npm ci
      - if: steps.sync.outputs.changed == 'true'
        run: npm test && python -m unittest discover -s tests -p 'test_*.py' && npm run build
      - name: 同步完整构建并提交
        if: steps.sync.outputs.changed == 'true'
        working-directory: .
        run: |
          cp -a _source/dist/. ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _source/projects _source/catalog.json _source/sync-state.json _source/sync-failures.json _source/public/sync-status.json projects assets runtimes index.html catalog.json sync-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(catalog): 自动同步原神网页活动'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: steps.sync.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outputs.changed == 'true'
        with:
          path: _source/dist
      - uses: actions/deploy-pages@v4
        if: steps.sync.outputs.changed == 'true'
        id: deploy
      - name: 验证线上构建完整性
        if: steps.sync.outputs.changed == 'true'
        run: node scripts/verify-deployment.mjs https://spine.moyijiangnan.cn/
