[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mihoyo-web-spine-extractor"
version = "0.6.2"
description = "Extract and organize Spine assets from miHoYo web events"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "Pillow>=10.4,<13",
  "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
spine-extract = "spine_extractor.cli:main"
spine-web = "spine_extractor.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spine_extractor = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
